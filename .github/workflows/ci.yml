
name: CI/CD Pipeline - DevOps Parcial 3

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # JOB 1: VALIDACIONES, CALIDAD Y PRUEBAS (CI)
  # ==========================================
  build-and-test:
    name: Validación, SonarQube y Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validación estructural HTML
        run: |
          echo "Verificando estructura del proyecto..."
          if [ -f "index.html" ] && grep -qi "<html" index.html; then
            echo "OK: index.html contiene la etiqueta HTML."
          else
            echo "ERROR: No cumple la validación estructural."
            exit 1
          fi

      - name: Análisis de calidad con SonarQube
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=usuarioL4_evaluacion-parcial-1-DevOps
            -Dsonar.organization=usuariol4
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=true

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker
        run: |
          docker build -t test-microservice:${{ github.sha }} .
          echo "Imagen construida correctamente."

      - name: Ejecutar Smoke Test
        run: |
          echo "Iniciando prueba funcional..."
          docker run -d -p 8081:80 --name container-test test-microservice:${{ github.sha }}
          trap 'docker rm -f container-test >/dev/null 2>&1 || true' EXIT

          for intento in {1..10}; do
            http_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/ || true)
            echo "Intento $intento - HTTP: $http_status"
            if [ "$http_status" = "200" ]; then
              echo "OK: Smoke Test aprobado."
              exit 0
            fi
            sleep 2
          done

          echo "ERROR: Smoke Test fallido."
          docker logs container-test
          exit 1

      - name: Registro de versión validada
        run: |
          echo "Todas las validaciones fueron aprobadas."
          echo "Commit validado: ${{ github.sha }}"

  # ==========================================
  # JOB 2: DESPLIEGUE CONTINUO Y OBSERVABILIDAD (CD)
  # ==========================================
  deploy-ec2:
    name: Despliegue en AWS EC2 y Métricas CloudWatch
    needs: build-and-test
    runs-on: ubuntu-latest

    # Se ejecuta solo en merges/pushes directos a main (no en Pull Requests)
    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Desplegar microservicio y enviar métricas
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            INICIO=$(date +%s)

            # Ajusta esta ruta si la carpeta clonada en tu EC2 tiene otro nombre
            cd ~/evaluacion-parcial-1-DevOps
            git pull origin main
            docker compose down
            docker compose up -d --build

            FIN=$(date +%s)
            DURACION=$((FIN - INICIO))

            aws cloudwatch put-metric-data --region us-east-1 --namespace "DevOps/CICD" --metric-name "TiempoDespliegue" --unit Seconds --value "$DURACION"
            aws cloudwatch put-metric-data --region us-east-1 --namespace "DevOps/CICD" --metric-name "CoberturaPruebas" --unit Percent --value 100
            echo "Despliegue completado en ${DURACION}s y métricas enviadas a CloudWatch."

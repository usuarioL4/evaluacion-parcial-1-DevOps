services:
  web:
    image: mi-sitio-devops:latest
    build: .
    ports:
      - "8080:8080"
    # Alta disponibilidad: recuperación automática ante fallas
    restart: always

    # Centralización de logs en AWS CloudWatch
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /devops/microservicio
        awslogs-stream: nginx-microservicio

    # Healthcheck: Monitoreo continuo de salud del contenedor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

    # Límites de desempeño y recursos
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 252M
